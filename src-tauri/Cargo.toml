[package]
name = "goldstone-launcher"
version = "0.3.1"
description = "Goldstone County Launcher"
authors = ["Nimnabro"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
open = "5"
tauri-plugin-dialog = "2.6.0"
winreg = "0.52"
base64 = "0.22"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
